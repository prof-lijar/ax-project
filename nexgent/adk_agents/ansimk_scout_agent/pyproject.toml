[project]
name = "ansimk-scout-agent"
version = "0.1.0"
description = "Standalone Google ADK web-research Scout backend POC"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ddgs>=9.15.0,<10.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "google-adk>=2.6.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "litellm>=1.84.0,<2.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "trafilatura>=2.2.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
