[project]
name = "nexgent-backend"
version = "0.1.0"
description = "FastAPI backend for Nexgent agent integrations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0,<0.116.0",
    "httpx>=0.27.0",
    "pillow>=11.0.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.2",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
