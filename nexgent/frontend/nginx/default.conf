server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /agent-server/ {
        proxy_pass http://agent-server:2024/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /weekly-report-bulk-api/ {
        proxy_pass http://weekly-report-bulk-api:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
