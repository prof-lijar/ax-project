[project]
name = "ax-gateway"
version = "0.1.0"
description = "Authenticated product API boundary for Agent Server"
requires-python = ">=3.11"
dependencies = ["ax-contracts", "ax-integrations", "fastapi>=0.115,<1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_gateway"]
