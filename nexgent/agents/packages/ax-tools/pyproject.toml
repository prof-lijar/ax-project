[project]
name = "ax-tools"
version = "0.1.0"
description = "Capability-scoped tool contracts and policies"
requires-python = ">=3.11"
dependencies = ["ax-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_tools"]
