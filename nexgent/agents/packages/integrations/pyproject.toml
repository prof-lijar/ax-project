[project]
name = "ax-integrations"
version = "0.1.0"
description = "Ports for models, stores, and external services"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12,<4.0",
    "asyncpg>=0.30,<1.0",
    "ax-contracts",
    "httpx>=0.27,<1.0",
    "mcp>=2.0,<3.0",
    "slack-sdk>=3.39,<4.0",
    "trafilatura>=2.1,<3.0",
]

[project.scripts]
ax-mcp = "ax_integrations.mcp_dev:main"
ax-slack-send = "ax_integrations.slack_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_integrations"]
