[project]
name = "ax-contracts"
version = "0.1.0"
description = "Versioned contracts shared by AX agent packages"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_contracts"]
