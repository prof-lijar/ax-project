[project]
name = "ax-observability"
version = "0.1.0"
description = "Structured telemetry and audit boundaries for AX agents"
requires-python = ">=3.11"
dependencies = ["ax-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_observability"]
