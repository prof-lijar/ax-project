[project]
name = "ax-integrations"
version = "0.1.0"
description = "Ports for models, stores, and external services"
requires-python = ">=3.11"
dependencies = ["ax-contracts", "httpx>=0.27,<1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_integrations"]
