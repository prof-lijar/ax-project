[project]
name = "ax-agents"
version = "0.1.0"
description = "Compiled LangGraph agents and supervisor graphs"
requires-python = ">=3.11"
dependencies = ["ax-contracts", "ax-runtime", "langgraph>=1.0,<2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_agents"]
