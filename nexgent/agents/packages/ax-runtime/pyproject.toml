[project]
name = "ax-runtime"
version = "0.1.0"
description = "Execution context and reliability primitives for AX graphs"
requires-python = ">=3.11"
dependencies = ["ax-contracts", "langgraph>=1.0,<2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_runtime"]
