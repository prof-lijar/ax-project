[project]
name = "ax-persistence"
version = "0.1.0"
description = "Persistence ports and durable storage adapters for AX agents"
requires-python = ">=3.11"
dependencies = ["asyncpg>=0.30,<1.0", "ax-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_persistence"]
