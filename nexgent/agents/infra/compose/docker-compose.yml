services:
  searxng:
    image: searxng/searxng:2026.7.17-81c9c2386@sha256:252cfb5b348809167f5519970ca3457711e723afc76179a662b1c720cbbc1dd3
    user: "977:977"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ../searxng/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /var/cache/searxng:rw,noexec,nosuid,size=64m,uid=977,gid=977,mode=0770
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ax-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-server:
    image: ${IMAGE_NAME}
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URI: redis://redis:6379
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGGRAPH_CLOUD_LICENSE_KEY: ${LANGGRAPH_CLOUD_LICENSE_KEY}
      SEARXNG_BASE_URL: http://searxng:8080
      WEEKLY_REPORT_SOURCE_URL: http://weekly-report-api:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      weekly-report-api:
        condition: service_healthy

  weekly-report-api:
    image: ${WEEKLY_REPORT_API_IMAGE}
    environment:
      ANSIMK_DATABASE_DSN: ${ANSIMK_DATABASE_DSN}
      ANSIMK_DATABASE_MIN_POOL_SIZE: ${ANSIMK_DATABASE_MIN_POOL_SIZE:-1}
      ANSIMK_DATABASE_MAX_POOL_SIZE: ${ANSIMK_DATABASE_MAX_POOL_SIZE:-5}
      ANSIMK_DATABASE_CONNECT_TIMEOUT_SECONDS: ${ANSIMK_DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      ANSIMK_DATABASE_COMMAND_TIMEOUT_SECONDS: ${ANSIMK_DATABASE_COMMAND_TIMEOUT_SECONDS:-30}
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  weekly-report-worker:
    image: ${WEEKLY_REPORT_WORKER_IMAGE}
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      WEEKLY_REPORT_JOB_DATABASE_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WEEKLY_REPORT_ARTIFACT_ROOT: /var/lib/ax/weekly-reports
      WEEKLY_REPORT_ARTIFACT_MIN_FREE_BYTES: ${WEEKLY_REPORT_ARTIFACT_MIN_FREE_BYTES:-10737418240}
      WEEKLY_REPORT_WORKER_CONCURRENCY: ${WEEKLY_REPORT_WORKER_CONCURRENCY:-32}
      WEEKLY_REPORT_ACTIVE_JOB_LIMIT: ${WEEKLY_REPORT_ACTIVE_JOB_LIMIT:-4}
      WEEKLY_REPORT_SOURCE_URL: http://weekly-report-api:8080
    volumes:
      - weekly-report-artifacts:/var/lib/ax/weekly-reports
    depends_on:
      postgres:
        condition: service_healthy
      weekly-report-api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  weekly-report-bulk-api:
    image: ${WEEKLY_REPORT_BULK_API_IMAGE}
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      WEEKLY_REPORT_JOB_DATABASE_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WEEKLY_REPORT_ARTIFACT_ROOT: /var/lib/ax/weekly-reports
      WEEKLY_REPORT_ARTIFACT_MIN_FREE_BYTES: ${WEEKLY_REPORT_ARTIFACT_MIN_FREE_BYTES:-10737418240}
      WEEKLY_REPORT_WORKER_CONCURRENCY: ${WEEKLY_REPORT_WORKER_CONCURRENCY:-32}
      WEEKLY_REPORT_STATUS_POLL_SECONDS: ${WEEKLY_REPORT_STATUS_POLL_SECONDS:-2}
    volumes:
      - weekly-report-artifacts:/var/lib/ax/weekly-reports
    expose:
      - "8090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 5s

  gateway:
    image: ${GATEWAY_IMAGE}
    environment:
      AGENT_SERVER_URL: http://agent-server:8000
    depends_on:
      - agent-server
    ports:
      - "8080:8080"

volumes:
  ax-postgres-data:
  weekly-report-artifacts:
