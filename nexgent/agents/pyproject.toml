[project]
name = "ax-agents-workspace"
version = "0.1.0"
description = "Modular AX agent workspace built on LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "ax-agents",
    "ax-contracts",
    "ax-evals",
    "ax-gateway",
    "ax-integrations",
    "ax-runtime",
    "ax-tools",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4,<1.0",
    "langgraph-sdk>=0.2,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_agents_workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ax-agents = { workspace = true }
ax-contracts = { workspace = true }
ax-evals = { workspace = true }
ax-gateway = { workspace = true }
ax-integrations = { workspace = true }
ax-runtime = { workspace = true }
ax-tools = { workspace = true }
