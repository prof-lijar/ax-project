name: nexgent

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    command:
      - uvicorn
      - app.main:app
      - --reload
      - --reload-dir
      - /app/app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - ./backend/dev.env
    environment:
      NEXGENT_CORS_FRONTEND_PORT: "${FRONTEND_PORT:-5173}"
      NEXGENT_CORS_ORIGIN_REGEX: "${NEXGENT_CORS_ORIGIN_REGEX:-}"
      WATCHFILES_FORCE_POLLING: "${WATCHFILES_FORCE_POLLING:-true}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
    environment:
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-true}"
      VITE_BACKEND_PORT: "${BACKEND_PORT:-8000}"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:5173/
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 5s

volumes:
  frontend_node_modules:
