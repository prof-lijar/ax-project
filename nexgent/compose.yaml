name: nexgent

include:
  - path: ./agents/compose.sumin.yaml
    env_file: ./agents/.env

services:
  scout:
    build:
      context: ./adk_agents/ansimk_scout_agent
    env_file:
      # Local defaults/Slack settings first; host-managed model credentials win.
      - path: ./adk_agents/ansimk_scout_agent/.env
        required: false
      - path: /etc/nexgent/internal-openai.env
        required: false
      - path: /etc/nexgent/nexgent-scout.env
        required: false
    environment:
      SCOUT_OUTPUT_ROOT: /app/var
    volumes:
      - scout-reports:/app/var
    expose:
      - "8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    stop_grace_period: 240s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health/live', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  searxng:
    image: searxng/searxng:2026.7.17-81c9c2386@sha256:252cfb5b348809167f5519970ca3457711e723afc76179a662b1c720cbbc1dd3
    user: "977:977"
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:-development-only-change-me}"
    volumes:
      - ./agents/infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /var/cache/searxng:rw,noexec,nosuid,size=64m,uid=977,gid=977,mode=0770
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/ >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  agent-server:
    build:
      context: ./agents
      dockerfile: apps/agent_server/Dockerfile.dev
    image: ax-agent-server-dev:local
    env_file:
      - ./agents/.env
    environment:
      AX768_GOOGLE_CREDENTIALS_FILE: /run/ax768/service-account.json
      AX768_MEMBERS_CREDENTIALS_FILE: /run/ax768/members-credentials.json
      AX768_ANSIMK_CODE_FILE: /run/ax768/ansimk-admin-code
      AX768_ANSIMK_SESSION_SEED_FILE: /run/ax768/ansimk-admin-session.json
      AX768_ANSIMK_SESSION_FILE: /run/ax768-auth/session.json
      LANGSMITH_TRACING: "${LANGSMITH_TRACING:-false}"
      SEARXNG_BASE_URL: http://searxng:8080
      OPENAI_SUPPORTS_VISION: "${OPENAI_SUPPORTS_VISION:-false}"
      AX_CHAT_ARTIFACT_ROOT: /run/ax-chat
      RAG_SERVER_BASE_URL: "${RAG_SERVER_BASE_URL:-http://host.docker.internal:8765}"
      RAG_SEARCH_TIMEOUT_SECONDS: "${RAG_SEARCH_TIMEOUT_SECONDS:-30}"
      WEEKLY_REPORT_SOURCE_URL: http://weekly-report-api:8080
      WEEKLY_REPORT_SOURCE_TIMEOUT_SECONDS: "${WEEKLY_REPORT_SOURCE_TIMEOUT_SECONDS:-30}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chat_attachments:/run/ax-chat:ro
      - type: bind
        source: ${AX768_MEMBERS_CREDENTIALS_HOST_FILE:-/home/nextor-ai-02/.local/share/nexgent/ansimk-members-credentials.json}
        target: /run/ax768/members-credentials.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AX768_SERVICE_ACCOUNT_HOST_FILE:-/home/nextor-ai-02/.local/share/nexgent/nexgent-service-account.json}
        target: /run/ax768/service-account.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AX768_ANSIMK_CODE_HOST_FILE:-/home/nextor-ai-02/.local/share/nexgent/ansimk-admin-code}
        target: /run/ax768/ansimk-admin-code
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AX768_ANSIMK_SESSION_HOST_FILE:-/home/nextor-ai-02/.local/share/nexgent/ansimk-admin-session.json}
        target: /run/ax768/ansimk-admin-session.json
        read_only: true
        bind:
          create_host_path: false
      - ax768_auth:/run/ax768-auth
    init: true
    expose:
      - "2024"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:2024/ok', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 10s
    depends_on:
      searxng:
        condition: service_healthy
      weekly-report-api:
        condition: service_healthy

  weekly-report-api:
    build:
      context: ./agents
      dockerfile: apps/weekly_report_api/Dockerfile
    image: ax-weekly-report-api-dev:local
    env_file:
      - ./agents/.env
    expose:
      - "8080"
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 5s

  weekly-report-jobs-db:
    image: postgres:16
    environment:
      POSTGRES_DB: "${WEEKLY_REPORT_JOB_DB:-ax_weekly_reports}"
      POSTGRES_USER: "${WEEKLY_REPORT_JOB_USER:-ax_bulk}"
      POSTGRES_PASSWORD: "${WEEKLY_REPORT_JOB_PASSWORD:-development-only-change-me}"
    volumes:
      - weekly-report-job-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${WEEKLY_REPORT_JOB_USER:-ax_bulk} -d ${WEEKLY_REPORT_JOB_DB:-ax_weekly_reports}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  weekly-report-worker:
    build:
      context: ./agents
      dockerfile: apps/workers/Dockerfile
    image: ax-weekly-report-worker-dev:local
    env_file:
      - ./agents/.env
    environment:
      WEEKLY_REPORT_JOB_DATABASE_DSN: postgresql://${WEEKLY_REPORT_JOB_USER:-ax_bulk}:${WEEKLY_REPORT_JOB_PASSWORD:-development-only-change-me}@weekly-report-jobs-db:5432/${WEEKLY_REPORT_JOB_DB:-ax_weekly_reports}
      WEEKLY_REPORT_ARTIFACT_ROOT: /var/lib/ax/weekly-reports
      WEEKLY_REPORT_ARTIFACT_MIN_FREE_BYTES: "${WEEKLY_REPORT_ARTIFACT_MIN_FREE_BYTES:-10737418240}"
      WEEKLY_REPORT_WORKER_CONCURRENCY: "${WEEKLY_REPORT_WORKER_CONCURRENCY:-32}"
      WEEKLY_REPORT_SOURCE_URL: http://weekly-report-api:8080
      WEEKLY_REPORT_SOURCE_TIMEOUT_SECONDS: "${WEEKLY_REPORT_SOURCE_TIMEOUT_SECONDS:-30}"
    volumes:
      - weekly-report-artifacts:/var/lib/ax/weekly-reports
    depends_on:
      weekly-report-jobs-db:
        condition: service_healthy
      weekly-report-api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  weekly-report-bulk-api:
    build:
      context: ./agents
      dockerfile: apps/weekly_report_bulk_api/Dockerfile
    image: ax-weekly-report-bulk-api-dev:local
    environment:
      WEEKLY_REPORT_JOB_DATABASE_DSN: postgresql://${WEEKLY_REPORT_JOB_USER:-ax_bulk}:${WEEKLY_REPORT_JOB_PASSWORD:-development-only-change-me}@weekly-report-jobs-db:5432/${WEEKLY_REPORT_JOB_DB:-ax_weekly_reports}
      WEEKLY_REPORT_ARTIFACT_ROOT: /var/lib/ax/weekly-reports
      WEEKLY_REPORT_ARTIFACT_MIN_FREE_BYTES: "${WEEKLY_REPORT_ARTIFACT_MIN_FREE_BYTES:-10737418240}"
      WEEKLY_REPORT_WORKER_CONCURRENCY: "${WEEKLY_REPORT_WORKER_CONCURRENCY:-32}"
      WEEKLY_REPORT_STATUS_POLL_SECONDS: "${WEEKLY_REPORT_STATUS_POLL_SECONDS:-2}"
    volumes:
      - weekly-report-artifacts:/var/lib/ax/weekly-reports
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      weekly-report-jobs-db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 5s

  daily-risk-scheduler:
    build:
      context: ./agents
      dockerfile: apps/daily_risk_scheduler/Dockerfile
    image: ax-daily-risk-scheduler-dev:local
    env_file:
      - ./agents/.env
    network_mode: host
    profiles:
      - scheduled
    init: true
    restart: unless-stopped
    stop_grace_period: 60s

  weekly-report-scheduler:
    build:
      context: ./agents
      dockerfile: apps/weekly_report_scheduler/Dockerfile
    image: ax-weekly-report-scheduler-dev:local
    environment:
      WEEKLY_REPORT_BULK_API_URL: http://weekly-report-bulk-api:8090
      WEEKLY_REPORT_SCHEDULE_MAX_REPORTS: "${WEEKLY_REPORT_SCHEDULE_MAX_REPORTS:-10000}"
      WEEKLY_REPORT_SCHEDULE_TIMEOUT_SECONDS: "${WEEKLY_REPORT_SCHEDULE_TIMEOUT_SECONDS:-30}"
      WEEKLY_REPORT_SCHEDULE_ATTEMPTS: "${WEEKLY_REPORT_SCHEDULE_ATTEMPTS:-3}"
      WEEKLY_REPORT_SCHEDULE_RETRY_DELAY_SECONDS: "${WEEKLY_REPORT_SCHEDULE_RETRY_DELAY_SECONDS:-2}"
    depends_on:
      weekly-report-bulk-api:
        condition: service_healthy
    profiles:
      - scheduled
    init: true
    restart: unless-stopped
    stop_grace_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    command:
      - uvicorn
      - app.main:app
      - --reload
      - --reload-dir
      - /app/app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - ./backend/dev.env
    environment:
      WATCHFILES_FORCE_POLLING: "${WATCHFILES_FORCE_POLLING:-true}"
      AX_AGENT_SERVER_URL: http://agent-server:2024
      AX_SCOUT_URL: http://scout:8091
      AX_WEEKLY_REPORT_BULK_URL: http://weekly-report-bulk-api:8090
      AX_CHAT_ARTIFACT_ROOT: /run/ax-chat
      AX_CHAT_FILE_ROOT: /var/lib/nexgent/chat-files
      AX_CHAT_DEPLOYMENT: development
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks:
      - default
      - database
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - chat_attachments:/run/ax-chat
      - chat_files:/var/lib/nexgent/chat-files
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 5s

  notification-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/dev.env
    environment:
      AX_CHAT_DEPLOYMENT: development
    entrypoint: ["python", "-m", "app.notifications.worker"]
    volumes:
      - ./backend:/app
    networks: [default, database]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 75s

  chat-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/dev.env
    environment:
      AX_AGENT_SERVER_URL: http://agent-server:2024
      AX_CHAT_ARTIFACT_ROOT: /run/ax-chat
      AX_CHAT_FILE_ROOT: /var/lib/nexgent/chat-files
      AX_CHAT_DEPLOYMENT: development
    entrypoint: ["python", "-m", "app.chat.worker"]
    volumes:
      - chat_attachments:/run/ax-chat
      - chat_files:/var/lib/nexgent/chat-files
    networks: [default, database]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      backend:
        condition: service_healthy
      agent-server:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
    environment:
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-true}"
      NEXGENT_BACKEND_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      scout:
        condition: service_healthy
      agent-server:
        condition: service_healthy
      backend:
        condition: service_healthy
      weekly-report-bulk-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:5173/
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 5s

networks:
  database:
    external: true
    name: nexgent-rag_default

volumes:
  ax768_auth:
  chat_files:
  scout-reports:
  frontend_node_modules:
  weekly-report-job-data:
  weekly-report-artifacts:
  chat_attachments:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m,uid=10001,gid=10001,mode=0700
